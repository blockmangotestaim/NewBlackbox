name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Install CMake 3.22.1
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"
      - name: Add extra Maven repositories
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/repos.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.dependencyResolutionManagement {
                  repositories {
                      maven { url 'https://jitpack.io' }
                      jcenter()
                  }
              }
          }
          allprojects {
              repositories {
                  maven { url 'https://jitpack.io' }
                  jcenter()
              }
          }
          EOF
      - name: Diagnostics
        run: |
          echo "=== settings.gradle ==="; cat settings.gradle
          echo "=== app/build.gradle ==="; cat app/build.gradle
          echo "=== usages ==="
          grep -rn "stateview\|catloading\|floatingview\|StateView\|CatLoading\|FloatingView" app/src || true
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BlackBox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
